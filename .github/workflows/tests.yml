name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "pandas>=2.2,<2.3" "pyarrow>=16" "scikit-learn>=1.5" "scipy>=1.13" \
                      "statsmodels>=0.14" "matplotlib>=3.9" "catboost>=1.2.7" "optuna>=4" "pyyaml>=6" \
                      "joblib>=1.4" "tqdm>=4.66" "requests>=2.32" "typer>=0.12" "rich>=13.7" "tabulate>=0.9" "openpyxl>=3.1" "lightgbm>=4.5" "xgboost>=2.1" "pytest>=8.2"
          pip install -e . --no-deps
      - name: Run tests
        run: python -m pytest -q
