# External validation on City of Palo Alto public charging sessions.
# Identical to acn.yaml except for the sites (location clusters) and the data period.
project:
  seed: 20261015
  sites:
  - california_ave
  - downtown
  - mitchell_park
  - rinconada
  horizons_hours:
  - 1
  - 2
  - 4
  prediction_frequency_minutes: 15
  five_seeds:
  - 11
  - 23
  - 37
  - 51
  - 79
  resume: true
data:
  raw_dir: data/raw
  processed_dir: data/processed
  start: '2011-07-01'
  end: '2020-12-31'
  timezone: America/Los_Angeles
  drop_negative_duration: true
  min_duration_minutes: 5
  max_duration_hours: 168
  max_energy_kwh: 200
  source: City of Palo Alto, Electric Vehicle Charging Station Usage (July 2011 -
    Dec 2020), ChargePoint Data CY20Q4.csv
splits:
  train_fraction: 0.7
  calibration_fraction: 0.1
  validation_fraction: 0.1
  test_fraction: 0.2
  embargo_hours: 4
  pandemic_break: '2020-03-01'
features:
  numeric:
  - arrival_hour_sin
  - arrival_hour_cos
  - weekday_sin
  - weekday_cos
  - month_sin
  - month_cos
  - user_prior_count
  - user_prior_mean_duration
  - user_prior_median_duration
  - user_prior_mean_energy
  - station_prior_count
  - station_prior_mean_duration
  - station_prior_mean_energy
  - requested_energy_kwh
  - requested_duration_hours
  categorical:
  - site
  - station_id
  - is_weekend
  driver_features:
  - requested_energy_kwh
  - requested_duration_hours
models:
  ridge:
    alpha: 10.0
  catboost:
    iterations: 2500
    depth: 8
    learning_rate: 0.03
    loss_function: MAE
    l2_leaf_reg: 5.0
    random_strength: 1.0
    task_type: GPU
    verbose: 200
    devices: '0'
  torch_ft:
    d_token: 96
    n_heads: 8
    n_layers: 4
    dropout: 0.1
    batch_size: 1024
    epochs: 120
    patience: 15
    lr: 0.0008
    weight_decay: 0.0001
    amp: true
tuning:
  enabled: true
  canonical_seed: 11
  trials_per_model: 8
  torch_tuning_epochs: 45
conformal:
  alpha: 0.1
  calibration_budgets:
  - 0
  - 25
  - 50
  - 100
  - 250
  - 500
  - 1000
  cqr: true
bootstrap:
  n_boot: 3000
  confidence: 0.95
  block: day
occupancy:
  model:
    iterations: 1800
    depth: 8
    learning_rate: 0.04
    l2_leaf_reg: 3.0
    early_stopping_rounds: 120
  congested_current_free_fraction_threshold: 0.5
  confidence_threshold: 0.8
visualization:
  dpi: 600
  formats:
  - png
  - pdf
  - svg
  vector_text: true
experiment:
  learned_models:
  - ridge
  - catboost
  - torch_ft
paper:
  learners:
  - catboost
  - ft
  decomposition_end: '2020-03-01'
  availability_learner: catboost
  charging_power_kw: 6.6
  n_boot: 2000
  ft_epochs: 40
  ft_patience: 6
benchmark:
  models:
  - mean
  - user_history
  - ridge
  - random_forest
  - extra_trees
  - hgb
  - lightgbm
  - xgboost
  - catboost
  - mlp
  - ft
  - tabpfn
  protocols:
  - random
  - driver_grouped
  - chronological
  - chronological_prepandemic
  - site_transfer
  - site_transfer_strict
  protocol_models:
    chronological_prepandemic:
    - mean
    - user_history
    - ridge
    - lightgbm
    - catboost
    - ft
    site_transfer_strict:
    - mean
    - user_history
    - ridge
    - lightgbm
    - catboost
    - ft
  folds: 5
  repeats: 5
  gpu: true
  deep:
    epochs: 60
    patience: 8
    batch: 1024
    lr: 0.001
  model_params:
    tabpfn:
      max_train_rows: 10000
