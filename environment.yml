# Environment used for the published results (Python 3.12, CUDA 12.4).
# The exact versions of every package are listed in requirements-lock.txt.
name: evtrust
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - cairo            # system library behind cairosvg (Figure 1 export)
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - numpy==1.26.4
      - pandas>=2.2,<2.3
      - pyarrow>=16,<19
      - scikit-learn>=1.5,<1.7
      - scipy>=1.13,<1.15
      - statsmodels>=0.14,<0.15
      - matplotlib>=3.9,<3.10
      - openpyxl>=3.1,<4
      - pyyaml>=6,<7
      - joblib>=1.4,<2
      - tqdm>=4.66,<5
      - requests>=2.32,<3
      - typer>=0.12,<1
      - rich>=13.7,<14
      - tabulate>=0.9,<1
      - catboost>=1.2.7,<1.3
      - lightgbm>=4.5,<5
      - xgboost>=2.1,<3
      - optuna>=4,<5
      - torch==2.6.0
      - tabpfn>=2.0,<3
      - cairosvg>=2.7,<3
      - pytest>=8.2,<9
      - -e .
